name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/iron-serpent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/iron-serpent/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Real-browser E2E against the production build: full encrypt/decrypt
      # round trip, CTR explorer, axe with color-contrast, mobile layout.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: demos/iron-serpent/playwright-report
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demos/iron-serpent/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
