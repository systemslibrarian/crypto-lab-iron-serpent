name: Argon2 source and distribution provenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/argon2-provenance.yml'
      - 'scripts/check-argon2-provenance.py'
      - 'scripts/tests/test_argon2_provenance.py'
      - 'docs/argon2-provenance.*'
      - 'demos/iron-serpent/public/argon2*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/argon2-provenance.yml'
      - 'scripts/check-argon2-provenance.py'
      - 'scripts/tests/test_argon2_provenance.py'
      - 'docs/argon2-provenance.*'
      - 'demos/iron-serpent/public/argon2*'
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Exercise coverage and unreadable/mismatch controls offline
        run: python3 -m unittest discover -s scripts/tests -p 'test_argon2_provenance.py' -v
      - name: Verify tracked fingerprints and official distribution bytes
        run: python3 scripts/check-argon2-provenance.py --distribution
  source-reproduction:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: antelle/argon2-browser
          ref: 63cda65cd2182e39a139aa074e2306332ddd4417
          path: .provenance-source/browser
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: P-H-C/phc-winner-argon2
          ref: 16d3df698db2486dde480b09a732bf9bf48599f9
          path: .provenance-source/argon2
          persist-credentials: false
      - name: Fetch immutable historical compiler image
        run: docker pull --platform linux/amd64 emscripten/emsdk@sha256:5871ba43a788243cbf890e2cb1a95e33e9cb72dcf52e1d2077ca39f2171f8b07
      - name: Rebuild fresh C objects and locked bundle; compare active artifacts
        run: >-
          python3 scripts/check-argon2-provenance.py --source-rebuild
          --publisher-source .provenance-source/browser
          --argon2-source .provenance-source/argon2
          > argon2-source-rebuild.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: argon2-source-rebuild
          path: argon2-source-rebuild.json
          if-no-files-found: error
